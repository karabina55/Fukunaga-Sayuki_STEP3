<!DOCTYPE html>
<html lang="ja">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width-device-width, initial-scale=1.0">
 <title>Test3</title>

 <link rel="stylesheet" href="test.css">
</head>
<body>

    <header>
        <h1>TNG CAFE</h1>
        <P><em>心安らぐ一杯をあなたに</em></P>
    </header>
    
    <nav>
        <ul>
            <li><a href="#section1">About Us</a></li>
            <li><a href="#section2">Menu</a></li>
            <li><a href="#section3">Contact</a></li>
        </ul>
    </nav>
    
    <main>
        <section id="section1">
            <h2>About Us</h2>
            <p>TNGCafeは自然の香りに包まれたリラックス空間を提供しています。<br>自家焙煎コーヒーと手作りスイーツで、穏やかな時間をお過ごしください。</p>
            <img src="sample.jpg" alt="カフェの写真" width="200">
        </section>
    
        <section id="section2">
            <h2>Menu</h2>
            <div class="menu-container">
                <div class="menu-item">
                    <img src="sample.jpg" alt="コーヒー" width="100">
                    <p>ブレンドコーヒー</p>
                </div>
                <div class="menu-item">
                    <img src="sample.jpg" alt="ケーキ" width="100">
                    <p>ベイクドチーズケーキ</p>
                </div>
                <div class="menu-item">
                    <img src="sample.jpg" alt="ラテ" width="100">
                    <p>カフェラテ</p>
                </div>
            </div>
        </section>
    
        <section id="section3">
            <h2>Contact</h2>
            <form action="#" method="post">
    
                <label for="name">お名前:</label><br>
                <input type="text" id="name" name="name"><br><br>
    
                <label for="email">メールアドレス:</label><br>
                <input type="email" id="email" name="email"><br><br>
    
                <label for="message">お問い合わせ内容:</label><br>
                <textarea type="message" id="message" name="message" rows="4" cols="40"></textarea><br><br>
    
                <button type="submit">送信</button>
            </form>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2026 TNG Cafe</p>
    </footer>

</body>
</html>
